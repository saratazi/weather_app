<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">
        <img src="https://cdn-icons-png.flaticon.com/512/54/54481.png" alt="search">
      </button>
        </div>

        <div class="weather-info" id="weatherInfo">
            <img id="weatherIcon" src="" alt="weather icon">
            <h1 id="temperature">--°C</h1>
            <h2 id="cityName">City Name</h2>

            <div class="details">
                <div class="detail-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png" alt="humidity">
                    <div>
                        <p id="humidity">--%</p>
                        <span>Humidity</span>
                    </div>
                </div>

                <div class="detail-item">
                    <img src="https://cdn-icons-png.flaticon.com/512/1146/1146858.png" alt="wind">
                    <div>
                        <p id="windSpeed">-- km/h</p>
                        <span>Wind Speed</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="error" id="errorMsg">City not found. Please try again.</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
