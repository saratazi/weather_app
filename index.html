<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="card">

    <h1 class="title">Weather App</h1>

    <div class="search-box">

        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name">

        <button id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button id="locationBtn">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>

    </div>

    <div id="errorMsg" class="error">
        City not found.
    </div>

    <div class="weather-info" id="weatherInfo">

        <img id="weatherIcon" src="" alt="Weather">

        <h1 id="temperature">0°C</h1>

        <h2 id="cityName">City</h2>

        <p id="description"></p>

        <div class="details">

            <div class="detail">

                <i class="fa-solid fa-temperature-half"></i>

                <div>
                    <span>Feels Like</span>
                    <h3 id="feelsLike">0°C</h3>
                </div>

            </div>

            <div class="detail">

                <i class="fa-solid fa-droplet"></i>

                <div>
                    <span>Humidity</span>
                    <h3 id="humidity">0%</h3>
                </div>

            </div>

        </div>

        <div class="details">

            <div class="detail">

                <i class="fa-solid fa-wind"></i>

                <div>
                    <span>Wind</span>
                    <h3 id="windSpeed">0 km/h</h3>
                </div>

            </div>

            <div class="detail">

                <i class="fa-solid fa-eye"></i>

                <div>
                    <span>Visibility</span>
                    <h3 id="visibility">0 km</h3>
                </div>

            </div>

        </div>

        <div class="details">

            <div class="detail">

                <i class="fa-solid fa-sun"></i>

                <div>
                    <span>Sunrise</span>
                    <h3 id="sunrise">--:--</h3>
                </div>

            </div>

            <div class="detail">

                <i class="fa-solid fa-moon"></i>

                <div>
                    <span>Sunset</span>
                    <h3 id="sunset">--:--</h3>
                </div>

            </div>

        </div>

        <p class="date" id="date"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
